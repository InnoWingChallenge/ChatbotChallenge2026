<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InnoWing 图片筛选台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17302d;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}header{background:#143d36;color:white;padding:26px 4vw}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6}header p{margin:0;color:#c7dfd7}.toolbar{padding:16px 4vw;background:white;border-bottom:1px solid #dce4de}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}button,select,input,textarea{font:inherit;border:1px solid #c7d3ce;border-radius:7px;padding:8px 11px;background:white;color:#17302d}button{cursor:pointer}button:hover{background:#edf4ef}button:focus-visible,a:focus-visible{outline:3px solid #df9d30}button.primary{background:#195b48;color:white}button:disabled{opacity:.45;cursor:default}input[type=checkbox]{width:19px;height:19px;cursor:pointer}#search{flex:1;min-width:220px}small,.muted{color:#617770}#notice{font-size:13px;color:#745013}main{padding:20px 4vw}.stats{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;margin-bottom:18px}.stats b{font-size:22px;margin-right:5px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{border:1px solid #d5dfd9;border-radius:12px;background:white;overflow:hidden}.card.chosen{outline:3px solid #21816b}.top{display:flex;align-items:center;justify-content:space-between;padding:9px 12px}.badge{font-size:12px;padding:4px 8px;border-radius:20px;background:#edf1ed}.keep{background:#d9eddf}.defer{background:#ece9e3}.review{background:#fff0cb}.photo{width:100%;height:225px;object-fit:contain;background:#f8f9f7;cursor:zoom-in}.body{padding:10px 12px}.meta{font-size:12px;color:#62766d;overflow-wrap:anywhere}.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1;font-size:13px;padding:7px 2px}.reason{font-size:13px;min-height:35px;margin:8px 0}.links{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:12px}a{color:#176c55}#pager{justify-content:center;padding:22px}dialog{border:0;border-radius:14px;max-width:1100px;width:94vw;max-height:94vh;padding:20px;background:#fbfcfa}dialog::backdrop{background:#08251dd9}.viewer{display:grid;grid-template-columns:minmax(0,3fr) minmax(230px,1fr);gap:18px}#large{width:100%;height:68vh;object-fit:contain;background:#eef1ec}#note{width:100%;height:90px}#modalMeta{overflow-wrap:anywhere;font-size:13px;line-height:1.7}.empty{padding:50px;text-align:center;color:#657a70}#message{min-height:22px;font-size:13px;color:#735413}.hint{font-size:12px;margin-top:12px;color:#657a70}@media(max-width:700px){.viewer{grid-template-columns:1fr}#large{height:40vh}header{padding:20px}main,.toolbar{padding:14px}}
</style>
<header><h1>InnoWing 图片筛选台</h1><p>优先处理例外，再抽查候选。保留、暂缓和待定都不会删除原图。</p></header>
<section class="toolbar">
 <div class="row"><button id="presetReview" class="primary">待复核队列</button><button id="presetPending">等待 AI 的图片</button><button id="presetKeep">抽查候选</button><button id="presetDefer">抽查暂缓</button><button id="clearRelated" hidden>退出相似组</button></div>
 <div class="row"><label>状态 <select id="state"><option value="review">待复核</option><option value="keep">保留</option><option value="defer">暂缓</option><option value="all">全部</option></select></label><label>进度 <select id="progress"><option value="unreviewed">尚未人工判断</option><option value="all">全部进度</option><option value="reviewed">已人工判断</option></select></label><label>类型 <select id="kind"><option value="all">全部类型</option><option value="T">海报 / 文字 / 地图</option><option value="E">设备 / 设施</option><option value="S">空间布局</option><option value="P">项目 / 原型</option></select></label><label>排序 <select id="sort"><option value="priority">来源优先级</option><option value="resolution">分辨率从高到低</option></select></label><input id="search" placeholder="搜索图片编号或来源网址" aria-label="搜索"></div>
 <div class="row"><button id="selectPage">全选本页</button><button id="clearSelected">清空选择</button><span id="selectedCount"></span><button data-batch="keep">所选保留</button><button data-batch="defer">所选暂缓</button><button data-batch="review">所选待定</button><button id="undo">撤销上一步</button></div>
 <div class="row"><button id="export" class="primary">导出人工判断</button><button id="import">导入之前的判断</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
 <div id="notice">判断暂存于当前浏览器。关闭前请导出 JSON 备份；网页不会直接修改项目清单或数据库。</div><div id="message" role="status"></div>
</section>
<main><div id="stats" class="stats"></div><div id="grid"></div><div id="pager" class="row"><button id="prev">上一页</button><span id="pageLabel"></span><button id="next">下一页</button></div></main>
<dialog id="viewer"><div class="row" style="justify-content:space-between"><strong id="modalTitle"></strong><button id="close">关闭 Esc</button></div><div class="viewer"><img id="large" alt="图片预览"><div><div id="modalMeta"></div><p><a id="original" target="_blank" rel="noopener">打开原图放大查看 ↗</a></p><p><a id="source" target="_blank" rel="noopener">来源网页 / 图片 ↗</a></p><textarea id="note" maxlength="2000" placeholder="可选：记录判断理由" aria-label="判断理由"></textarea><div class="actions"><button data-modal="keep">1 保留</button><button data-modal="defer">2 暂缓</button><button data-modal="review">3 待定</button></div><div class="row"><button id="backImage">← 上一张</button><button id="forwardImage">下一张 →</button></div><p class="hint">按 1 / 2 / 3 判断后自动进入下一张；方向键切换。原图文字看不清时请保留为待定。</p></div></div></dialog>
<script id="data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent), images=DATA.images, byId=new Map(images.map(r=>[r.id,r]));
const $=id=>document.getElementById(id), labels={keep:'保留',defer:'暂缓',review:'待复核'};
const reasons={pending_visual_recheck:'等待补充 AI 复核',valuable_but_small_original:'有用，但原图尺寸较小',format_size_or_animation_requires_separate_review:'格式、超大图或动画需要检查',uncertain_or_insufficient_preview:'内容不确定 / 预览不足',generic_event_portrait_decoration:'普通活动、肖像或装饰',identical_decoded_pixels:'像素完全相同，已有替代图',text_poster_map_sign:'海报、地图、标牌等文字资料',equipment_facility:'设备或设施',space_layout:'空间布局',project_demonstration:'项目、原型或演示',disagreement_in_targeted_quality_check:'两次判断不一致'};
const KEY='innowing-image-review-v1'; let edits={}, selected=new Set(), history=[], page=0, related=null, onlyPending=false, modalIds=[], modalIndex=0; const PAGE=48;
function validate(payload){if(!payload||payload.schema!==KEY||!Array.isArray(payload.records))throw Error('不是此页面导出的判断文件'); const next={}; for(const e of payload.records){const r=byId.get(e.id);if(!r||r.sha256!==e.sha256)throw Error('图片不存在或内容已变化：'+e.id);if(next[e.id]||!labels[e.decision]||typeof(e.note??'')!=='string'||(e.note||'').length>2000)throw Error('判断格式无效或编号重复');next[e.id]={id:e.id,sha256:e.sha256,decision:e.decision,note:e.note||'',updated_at:e.updated_at||''};}return next;}
function message(s){$('message').textContent=s;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({schema:KEY,records:Object.values(edits)}));}catch(e){message('浏览器无法暂存，请立即导出 JSON 保存判断。');}}
for(const e of DATA.human)if(byId.has(e.id)&&byId.get(e.id).sha256===e.sha256)edits[e.id]=e;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old?.schema===KEY){let stale=0;for(const e of old.records||[]){if(byId.has(e.id)&&byId.get(e.id).sha256===e.sha256&&labels[e.decision]){if(!edits[e.id]||(e.updated_at||'')>=(edits[e.id].updated_at||''))edits[e.id]=e;}else stale++;}if(stale)message(`忽略 ${stale} 条不属于当前图片内容的旧判断。`);}}catch(e){message('未能读取浏览器暂存；可导入之前导出的判断。');}
function effective(r){return edits[r.id]?.decision||r.decision;}
function filtered(){const query=$('search').value.trim().toLowerCase();return images.filter(r=>(!related||related.has(r.id))&&(!onlyPending||r.pending)&&($('state').value==='all'||effective(r)===$('state').value)&&($('progress').value==='all'||($('progress').value==='reviewed')===Boolean(edits[r.id]))&&($('kind').value==='all'||r.kind===$('kind').value)&&(!query||(r.id+' '+r.url).toLowerCase().includes(query))).sort((a,b)=>$('sort').value==='resolution'?b.width*b.height-a.width*a.height:b.priority-a.priority||a.id.localeCompare(b.id));}
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function button(text,fn){const el=element('button',text);el.onclick=fn;return el;}
function mark(ids,decision,note=''){if(!ids.length)return;history.push({...edits});if(history.length>30)history.shift();for(const id of ids){const r=byId.get(id);edits[id]={id,sha256:r.sha256,decision,note,updated_at:new Date().toISOString()};selected.delete(id);}persist();render();message(`已将 ${ids.length} 张标记为${labels[decision]}；记得导出保存。`);}
function showSimilar(r){related=new Set([r.id,...r.similar]);onlyPending=false;$('state').value='all';$('progress').value='all';$('kind').value='all';$('search').value='';$('sort').value='resolution';page=0;render();message('相似组按分辨率排序。相似不等于相同，请比较文字、裁剪范围和细节。');}
function render(){const list=filtered();page=Math.max(0,Math.min(page,Math.max(0,Math.ceil(list.length/PAGE)-1)));const visible=list.slice(page*PAGE,(page+1)*PAGE), grid=$('grid');grid.replaceChildren();for(const r of visible){const card=element('article',undefined,'card'+(selected.has(r.id)?' chosen':''));const top=element('div',undefined,'top'),check=element('input');check.type='checkbox';check.checked=selected.has(r.id);check.setAttribute('aria-label','选择 '+r.id);check.onchange=()=>{check.checked?selected.add(r.id):selected.delete(r.id);card.classList.toggle('chosen',check.checked);updateSelected();};top.append(check,element('span',(edits[r.id]?'人工 · ':'初筛 · ')+labels[effective(r)],'badge '+effective(r)));const img=element('img');img.className='photo';img.loading='lazy';img.src=r.preview;img.alt='图片 '+r.id;img.tabIndex=0;img.onclick=()=>openImage(r.id,list);img.onkeydown=e=>{if(e.key==='Enter')openImage(r.id,list);};const body=element('div',undefined,'body');body.append(element('div',`${r.width||'?'} × ${r.height||'?'} · ${r.id.slice(0,12)}`,'meta'),element('p',reasons[r.reason]||r.reason,'reason'));const actions=element('div',undefined,'actions');for(const [k,label]of Object.entries(labels))actions.append(button(label,()=>mark([r.id],k)));const links=element('div',undefined,'links');const raw=element('a','原图 ↗');raw.href=r.raw;raw.target='_blank';raw.rel='noopener';links.append(raw);if(r.similar.length)links.append(button(`比较相似图 (${r.similar.length})`,()=>showSimilar(r)));body.append(actions,links);card.append(top,img,body);grid.append(card);}if(!visible.length)grid.append(element('div','当前条件下没有图片。可以切换状态、类型或进度。','empty'));$('stats').replaceChildren();for(const [k,label] of Object.entries(labels)){const el=element('span');el.append(element('b',String(images.filter(r=>effective(r)===k).length)),document.createTextNode(label));$('stats').append(el);}$('stats').append(element('span',`人工已判断 ${Object.keys(edits).length} / ${images.length}`));$('pageLabel').textContent=`${list.length} 张匹配 · ${page+1} / ${Math.max(1,Math.ceil(list.length/PAGE))} 页`;$('prev').disabled=page===0;$('next').disabled=(page+1)*PAGE>=list.length;$('clearRelated').hidden=!related;$('undo').disabled=!history.length;updateSelected();}
function updateSelected(){$('selectedCount').textContent=`已选 ${selected.size} 张（可跨页）`;document.querySelectorAll('[data-batch]').forEach(b=>b.disabled=!selected.size);}
function openImage(id,list){modalIds=list.map(r=>r.id);modalIndex=modalIds.indexOf(id);refreshModal();$('viewer').showModal();}
function refreshModal(){const r=byId.get(modalIds[modalIndex]);$('large').src=r.preview;$('modalTitle').textContent=`${modalIndex+1} / ${modalIds.length} · ${labels[effective(r)]}`;$('modalMeta').textContent=`${r.id}\n${r.width||'?'} × ${r.height||'?'}\n${reasons[r.reason]||r.reason}`;$('modalMeta').style.whiteSpace='pre-line';$('original').href=r.raw;$('source').href=r.url;$('source').hidden=!r.url;$('note').value=edits[r.id]?.note||'';$('backImage').disabled=modalIndex===0;$('forwardImage').disabled=modalIndex===modalIds.length-1;}
function move(delta){modalIndex=Math.max(0,Math.min(modalIds.length-1,modalIndex+delta));refreshModal();}
function modalMark(code){mark([modalIds[modalIndex]],code,$('note').value);if(modalIndex+1<modalIds.length)move(1);else $('viewer').close();}
function preset(state,pending=false){related=null;onlyPending=pending;page=0;$('state').value=state;$('progress').value='unreviewed';$('kind').value='all';$('search').value='';selected.clear();render();}
$('presetReview').onclick=()=>preset('review');$('presetPending').onclick=()=>preset('review',true);$('presetKeep').onclick=()=>preset('keep');$('presetDefer').onclick=()=>preset('defer');$('clearRelated').onclick=()=>{related=null;page=0;render();};
for(const id of ['state','progress','kind','sort'])$(id).onchange=()=>{page=0;render();};$('search').oninput=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('selectPage').onclick=()=>{filtered().slice(page*PAGE,(page+1)*PAGE).forEach(r=>selected.add(r.id));render();};$('clearSelected').onclick=()=>{selected.clear();render();};document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>mark([...selected],b.dataset.batch));document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>modalMark(b.dataset.modal));$('undo').onclick=()=>{if(history.length){edits=history.pop();persist();render();message('已撤销上一步。');}};
$('close').onclick=()=>$('viewer').close();$('backImage').onclick=()=>move(-1);$('forwardImage').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if($('viewer').open){if(['1','2','3'].includes(e.key)){e.preventDefault();modalMark({'1':'keep','2':'defer','3':'review'}[e.key]);}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}else if(e.key==='ArrowRight'){e.preventDefault();move(1);}}});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:KEY,exported_at:new Date().toISOString(),records:Object.values(edits)},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=element('a');a.href=url;a.download='innowing-human-reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message(`已导出 ${Object.keys(edits).length} 条人工判断。将文件导入项目后才会更新 reviewed_keep.json。`);};
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const incoming=validate(JSON.parse(await file.text()));history.push({...edits});edits={...edits,...incoming};persist();render();message(`已导入 ${Object.keys(incoming).length} 条判断。`);}catch(err){message('导入失败：'+err.message);}finally{e.target.value='';}};
render();
</script></html>
